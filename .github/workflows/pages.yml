name: Publish Furever Home
on:
  push:
    branches: [main]
    paths-ignore:
      - 'oauth-worker/**'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify GitHub Actions is the Pages source
        run: node scripts/check-pages-source.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm test
      - uses: actions/configure-pages@v5
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
