name = "furever-github-oauth"
main = "src/index.mjs"
compatibility_date = "2026-10-11"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "redirect.simplyhost.org"
custom_domain = true

[vars]
CMS_ORIGIN = "https://kittenrescueca.org"
AUTH_ORIGIN = "https://redirect.simplyhost.org"
GITHUB_REPOSITORY = "pchrisoc/kittenrescueca"
ALLOWED_GITHUB_USERS = "pchrisoc"
GITHUB_SCOPE = "public_repo"

# Set GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, and STATE_SECRET with Wrangler secrets.
